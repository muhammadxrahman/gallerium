<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#000008" />
    <meta name="description" content="Real-time sky awareness: stars, planets, Moon, and satellites from your location. Works offline." />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png" />
    <!-- iOS ignores SVG apple-touch icons, so a PNG is required for a crisp home-screen icon. -->
    <link rel="apple-touch-icon" href="./apple-touch-icon-180.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Gallerium" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Gallerium</title>
  </head>
  <body>
    <div id="app">
      <canvas id="sky-canvas"></canvas>
      <div id="status"></div>
      <div id="loader">
        <div class="loader-mark">GALLERI<span>U</span>M</div>
        <div class="loader-ring"></div>
        <div id="loader-text">Loading the sky…</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
